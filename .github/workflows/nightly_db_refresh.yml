name: Nightly DB Refresh

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC ≈ 2am Pacific
  workflow_dispatch:

jobs:
  refresh-db:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client + DNS tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client dnsutils

      # Resolve IPv4 and pin it in /etc/hosts
      - name: Force IPv4 for Supabase host
        env:
          PGHOST: ${{ secrets.PGHOST }} # e.g. db.cnwwhhmpashijqbspvhf.supabase.co
        run: |
          IP=$(dig +short A "$PGHOST" | head -n1)
          if [ -z "$IP" ]; then
            IP=$(getent ahostsv4 "$PGHOST" | awk '{print $1; exit}')
          fi
          if [ -z "$IP" ]; then
            echo "Could not resolve IPv4 for $PGHOST" >&2; exit 1
          fi
          echo "Pinning $PGHOST -> $IP"
          echo "$IP $PGHOST" | sudo tee -a /etc/hosts
          echo "IPV4=$IP" >> "$GITHUB_ENV"

      - name: Sanity check connection (IPv4)
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: 5432
          PGDATABASE: ${{ secrets.PGDATABASE }} # usually postgres
          PGUSER: postgres # or your DB user
          PGPASSWORD: ${{ secrets.PGPASSWORD }} # Supabase DB password
        run: |
          unset PGHOSTADDR
          psql "host=${PGHOST} port=${PGPORT} dbname=${PGDATABASE} user=${PGUSER} password=${PGPASSWORD} sslmode=require" \
            -v ON_ERROR_STOP=1 \
            -c "SELECT inet_server_addr() AS server_ip, now() AS connected_at_utc;"

      - name: Refresh matviews (CONCURRENTLY) + ANALYZE (IPv4)
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: 5432
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGUSER: postgres
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
        run: |
          unset PGHOSTADDR
          psql "host=${PGHOST} port=${PGPORT} dbname=${PGDATABASE} user=${PGUSER} password=${PGPASSWORD} sslmode=require" -v ON_ERROR_STOP=1 <<'SQL'
          SET statement_timeout = '0';
          REFRESH MATERIALIZED VIEW CONCURRENTLY public.player_pitching_games;
          REFRESH MATERIALIZED VIEW CONCURRENTLY public.player_pitching_laststarts_mat;
          REFRESH MATERIALIZED VIEW CONCURRENTLY public.pitcher_last3_agg;
          REFRESH MATERIALIZED VIEW CONCURRENTLY public.player_rolling_batting_agg;
          REFRESH MATERIALIZED VIEW CONCURRENTLY public.pitcher_rolling_per9;
          REFRESH MATERIALIZED VIEW CONCURRENTLY public.player_rolling_pitching_rates;
          REFRESH MATERIALIZED VIEW CONCURRENTLY public.player_rolling_agg_mat;
          REFRESH MATERIALIZED VIEW CONCURRENTLY public.bvp_rollup_prior;
          REFRESH MATERIALIZED VIEW CONCURRENTLY public.bvp_pairs;
          ANALYZE;
          SQL
