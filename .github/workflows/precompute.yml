name: Precompute MLB Props

on:
  schedule:
    - cron: "10 10-23 * * *" # hourly at :10 from 10:00–23:00 UTC (~6am–7pm ET)
  workflow_dispatch: {}

jobs:
  precompute:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE }}
      FEATURE_SET_TAG: v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Debug env presence (non-secret)
        run: |
          python - <<'PY'
          import os
          print("SUPABASE_URL set? ", bool(os.getenv("SUPABASE_URL")))
          print("Key present?       ", bool(os.getenv("SUPABASE_KEY") or os.getenv("SUPABASE_SERVICE_ROLE") or os.getenv("SUPABASE_SERVICE_ROLE_KEY")))
          PY

      # Runs for *today in ET* automatically (no date arg needed)
      - name: Precompute today (ET)
        env:
          PYTHONPATH: backend
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          FEATURE_SET_TAG: v1
        run: python -m scripts.precompute.precompute_props_daily

      # Fail the job if nothing was written (so you notice)
      - name: Verify rows were written for today (ET)
        run: |
          python - <<'PY'
          import os, datetime
          from zoneinfo import ZoneInfo
          from scripts.shared.supabase_utils import supabase

          DATE = datetime.datetime.now(ZoneInfo("America/New_York")).date().isoformat()
          TAG  = os.getenv("FEATURE_SET_TAG","v1")

          res = (
              supabase
              .from_("prop_features_precomputed")
              .select("prop_type", count="exact")
              .eq("game_date", DATE)
              .eq("feature_set_tag", TAG)
              .execute()
          )
          total = res.count or 0
          print(f"[verify] game_date={DATE} tag={TAG} rows={total}")
          if total == 0:
              raise SystemExit(1)
          PY
