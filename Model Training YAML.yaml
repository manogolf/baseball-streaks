Model Training YAML


features:
  # ────────── Basic Game Context ──────────
  is_home:
    type: binary
    required: true
    description: Whether the player was the home team

  opponent:
    type: categorical
    required: true
    transform: one_hot
    description: Opponent team abbreviation

  opponent_encoded:
    type: numeric
    required: false
    description: Integer encoding of opponent team

  game_day_of_week:
    type: categorical
    required: true
    transform: one_hot
    description: Day of the week (Monday–Sunday)

  time_of_day_bucket:
    type: categorical
    required: true
    transform: one_hot
    description: 'morning', 'afternoon', 'evening', etc.

  game_time:
    type: time
    required: false
    transform: bucketize
    description: Start time of game (ET), may be used for finer control than time_of_day_bucket

  # ────────── Streaks ──────────
  streak_type:
    type: categorical
    required: false
    transform: one_hot
    description: Whether the player is on a "hot", "cold", or "neutral" streak

  streak_count:
    type: numeric
    required: false
    description: Number of games in current streak

  # ────────── Rolling Averages ──────────
  d7_hits:
    type: numeric
    required: false
  d7_home_runs:
    type: numeric
    required: false
  d7_rbis:
    type: numeric
    required: false
  d7_strikeouts:
    type: numeric
    required: false
  d7_walks:
    type: numeric
    required: false

  d15_hits:
    type: numeric
    required: false
  d15_home_runs:
    type: numeric
    required: false
  d15_rbis:
    type: numeric
    required: false
  d15_strikeouts:
    type: numeric
    required: false
  d15_walks:
    type: numeric
    required: false

  d30_hits:
    type: numeric
    required: false
  d30_home_runs:
    type: numeric
    required: false
  d30_rbis:
    type: numeric
    required: false
  d30_strikeouts:
    type: numeric
    required: false
  d30_walks:
    type: numeric
    required: false

  # ────────── BvP: Batter vs Pitcher ──────────
  bvp_ab:
    type: numeric
    required: false
  bvp_hits:
    type: numeric
    required: false
  bvp_home_runs:
    type: numeric
    required: false
  bvp_strikeouts:
    type: numeric
    required: false
  bvp_walks:
    type: numeric
    required: false
  bvp_avg:
    type: numeric
    required: false

  # ────────── PvB: Pitcher vs Batters ──────────
  pvb_ab:
    type: numeric
    required: false
  pvb_hits:
    type: numeric
    required: false
  pvb_home_runs:
    type: numeric
    required: false
  pvb_strikeouts:
    type: numeric
    required: false
  pvb_walks:
    type: numeric
    required: false
  pvb_avg:
    type: numeric
    required: false
  pvb_plate_appearances:
    type: numeric
